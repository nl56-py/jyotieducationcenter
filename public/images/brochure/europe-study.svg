<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" width="100%" height="100%">
  <!-- Definitions for gradients and styles -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071f3d" />
      <stop offset="60%" stop-color="#0b1731" />
      <stop offset="100%" stop-color="#17156f" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08a8d7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#5b177d" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1536" fill="url(#bg-grad)" />

  <!-- Glowing background elements -->
  <circle cx="200" cy="300" r="300" fill="#08a8d7" opacity="0.08" filter="url(#glow)" />
  <circle cx="800" cy="1100" r="400" fill="#5b177d" opacity="0.12" filter="url(#glow)" />
  
  <!-- Subtle decorative grid pattern -->
  <g opacity="0.05">
    <path d="M 0,100 L 1024,100 M 0,200 L 1024,200 M 0,300 L 1024,300 M 0,400 L 1024,400 M 0,500 L 1024,500 M 0,600 L 1024,600 M 0,700 L 1024,700 M 0,800 L 1024,800 M 0,900 L 1024,900 M 0,1000 L 1024,1000 M 0,1100 L 1024,1100 M 0,1200 L 1024,1200 M 0,1300 L 1024,1300 M 0,1400 L 1024,1400 M 0,1500 L 1024,1500" stroke="#ffffff" stroke-width="1" />
    <path d="M 100,0 L 100,1536 M 200,0 L 200,1536 M 300,0 L 300,1536 M 400,0 L 400,1536 M 500,0 L 500,1536 M 600,0 L 600,1536 M 700,0 L 700,1536 M 800,0 L 800,1536 M 900,0 L 900,1536" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Abstract Flight Path (Paper Airplane Trail) -->
  <g opacity="0.2">
    <path d="M -50,1400 C 200,1300 100,800 450,700 C 800,600 700,200 950,150" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="12 10" />
    <!-- Small airplanes in flight path -->
    <path d="M 950,150 L 935,165 L 945,155 L 930,150 Z" fill="#ffffff" />
  </g>

