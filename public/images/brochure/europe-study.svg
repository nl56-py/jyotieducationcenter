    <text x="0" y="0" fill="#f4c400" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" letter-spacing="4" text-anchor="start">EDUMARK GLOBAL GUIDANCE</text>
    
    <!-- Title -->
    <text x="0" y="65" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" letter-spacing="1">Study Destinations</text>
    
    <!-- Subtitle -->
    <text x="0" y="115" fill="rgba(255, 255, 255, 0.65)" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="500">Compare our 8 primary pathways by intake &amp; alignment</text>
  </g>

