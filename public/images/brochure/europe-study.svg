    <text x="110" y="175" fill="#08a8d7" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">Sept, Jan, May</text>
    <text x="35" y="205" fill="rgba(255, 255, 255, 0.45)" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500">Popular: Business, MBA, Engineering</text>
